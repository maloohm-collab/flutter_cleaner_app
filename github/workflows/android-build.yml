# ===============================================================
# Project      : AI Cleaner
# File         : .github/workflows/android-build.yml
# Version      : 1.0.0
# Last Updated : 2026-10-10
#
# Purpose:
# Manual-only Android release APK build.
#
# Trigger:
# GitHub Actions > Android Release APK > Run workflow
#
# Safety:
# No automatic builds on push, pull requests, or file changes.
# ===============================================================

name: AI Cleaner - Manual Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-cleaner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
